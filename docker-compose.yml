
services:
  crypto_app:
    container_name: go_crypto
    build:
      context: .
      dockerfile: Dockerfile.crypto
    image: crypto-api
    ports:
      - 8181:8181
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=crypto
      - GECKO_API_KEY=key 
      - CMC_API_KEY=key 
      - AUTH_HOST=auth_app
      - AUTH_PORT=8080 
      - SERVER_ADDRESS=0.0.0.0 
      - SERVER_PORT=8181 
    depends_on:
      mysql:
        condition: service_healthy
      auth_app:
        condition: service_healthy
    networks:
      - go-network
    healthcheck:
      test: ["CMD", "/health-check"]
      interval: 10s
      timeout: 5s
      retries: 3 

  auth_app:
    container_name: go_auth
    build:
      context: .
      dockerfile: Dockerfile.auth
    image: auth-api
    ports:
      - 8080:8080
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=auth
      - SERVER_ADDRESS=0.0.0.0 
      - SERVER_PORT=8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - go-network
    healthcheck:
      # test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      # test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      # test: ["CMD", "/health-check","-port", "8080"]
      test: ["CMD", "/health-check"]
      interval: 10s
      timeout: 5s
      retries: 3 

  mysql:
    container_name: go_mysql
    image: mysql:9.0
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - dbdata:/var/lib/mysql
      - ./auth/migrations/01.Init.sql:/docker-entrypoint-initdb.d/1_init_auth.sql
      - ./crypto/migrations/01.Init.sql:/docker-entrypoint-initdb.d/2_init_crypto.sql
    networks:
      - go-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3


volumes:
  dbdata:

networks:
  go-network:
    driver: bridge